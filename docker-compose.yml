version: '3.8'

services:
  php:
    build: ./php
    container_name: webb_php
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - mysql
    environment:
      # Variables de conexión a la base de datos (ya existentes)
      - DB_HOST=mysql
      - DB_USER=webb_user
      - DB_PASSWORD=webb_pass
      - DB_NAME=webb_db
      # NUEVAS variables para el envío de correos (SMTP)
      - SMTP_HOST=smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=tu_usuario_mailtrap    # <-- Reemplazar con tu usuario real
      - SMTP_PASS=tu_contraseña_mailtrap # <-- Reemplazar con tu contraseña real
      - SMTP_SECURE=tls
      - MAIL_FROM=no-reply@colegio.com
      - MAIL_FROM_NAME=Sistema Educativo
    networks:
      - webb_net

  mysql:
    image: mysql:8.0
    container_name: webb_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: webb_db
      MYSQL_USER: webb_user
      MYSQL_PASSWORD: webb_pass
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - webb_mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - webb_net
    command: --innodb-buffer-pool-size=256M --query-cache-type=1 --query-cache-size=32M
    

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: webb_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root1234
    depends_on:
      - mysql
    networks:
      - webb_net

volumes:
  webb_mysql_data:

networks:
  webb_net:
    driver: bridge